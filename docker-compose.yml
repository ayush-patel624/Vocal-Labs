

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: workflow_builder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./hasura/migrations/1_init/up.sql:/docker-entrypoint-initdb.d/01_init.sql
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workflow_builder"]
      interval: 5s
      timeout: 5s
      retries: 10

  hasura:
    image: hasura/graphql-engine:v2.38.0
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:postgres@postgres:5432/workflow_builder
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: myadminsecret
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"supersecretkeythatisatleast32charslong!!"}'
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
      HASURA_GRAPHQL_ENABLED_APIS: metadata,graphql,config
      HASURA_GRAPHQL_ENABLE_ALLOWLIST: "false"
      HASURA_GRAPHQL_LOG_LEVEL: info
      ACTION_HANDLER_ENDPOINT: http://action-handler:3001
    ports:
      - "8085:8080"

  action-handler:
    build: ./action-handler
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/workflow_builder
      HASURA_GRAPHQL_URL: http://hasura:8080/v1/graphql
      HASURA_ADMIN_SECRET: myadminsecret
      JWT_SECRET: supersecretkeythatisatleast32charslong!!
      LLM_API_KEY: ${LLM_API_KEY:-stub}
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      PORT: 3001
    ports:
      - "3001:3001"

volumes:
  pgdata:
